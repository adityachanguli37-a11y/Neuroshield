<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NeuroShield — Terminal Authentication Gateway</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: var(--bg-primary);
      position: relative;
      overflow-y: auto;
      padding: 24px 16px;
    }

    .login-container {
      width: 100%;
      max-width: 460px;
      position: relative;
      z-index: 10;
    }

    .login-panel {
      padding: 32px;
      border-radius: var(--border-radius);
      background: rgba(11, 17, 25, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(0, 229, 255, 0.25);
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.8), 0 0 24px rgba(0, 229, 255, 0.08);
      position: relative;
    }

    /* Cyber Corner Brackets */
    .login-panel::before {
      content: "";
      position: absolute;
      top: -1px;
      left: -1px;
      width: 16px;
      height: 16px;
      border-top: 2px solid var(--neon-green);
      border-left: 2px solid var(--neon-green);
      border-top-left-radius: 4px;
      pointer-events: none;
    }

    .login-panel::after {
      content: "";
      position: absolute;
      bottom: -1px;
      right: -1px;
      width: 16px;
      height: 16px;
      border-bottom: 2px solid var(--cyber-cyan);
      border-right: 2px solid var(--cyber-cyan);
      border-bottom-right-radius: 4px;
      pointer-events: none;
    }

    .brand-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(0, 229, 255, 0.15);
    }

    .brand-logo-emblem {
      width: 44px;
      height: 44px;
      border-radius: var(--border-radius-sm);
      background: rgba(0, 229, 255, 0.08);
      border: 1px solid var(--cyber-cyan);
      box-shadow: 0 0 14px rgba(0, 229, 255, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--neon-green);
      flex-shrink: 0;
    }

    .brand-title {
      font-family: var(--font-mono);
      font-size: 20px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 2px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .brand-title span {
      color: var(--neon-green);
      text-shadow: 0 0 10px rgba(0, 255, 136, 0.6);
    }

    .system-status-chip {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-terminal);
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 2px;
    }

    .error-banner {
      padding: 10px 14px;
      background: rgba(255, 59, 92, 0.15);
      border: 1px solid var(--danger-red);
      color: #ff99b3;
      border-radius: var(--border-radius-sm);
      font-family: var(--font-mono);
      font-size: 11px;
      margin-bottom: 16px;
      display: none;
      box-shadow: 0 0 10px rgba(255, 59, 92, 0.2);
    }

    .demo-roster-box {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid rgba(0, 229, 255, 0.15);
    }

    .demo-roster-header {
      font-family: var(--font-mono);
      font-weight: 700;
      color: var(--cyber-cyan);
      margin-bottom: 10px;
      font-size: 11px;
      letter-spacing: 1px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .demo-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .btn-demo-credential {
      background: rgba(16, 25, 35, 0.85);
      border: 1px solid rgba(0, 229, 255, 0.2);
      border-radius: var(--border-radius-sm);
      padding: 8px 10px;
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 2px;
      cursor: pointer;
      transition: var(--transition-fast);
      font-family: var(--font-mono);
    }

    .btn-demo-credential:hover {
      background: var(--bg-panel-hover);
      border-color: var(--cyber-cyan);
      box-shadow: 0 0 12px rgba(0, 229, 255, 0.2);
      transform: translateY(-1px);
    }

    .btn-demo-credential .role-title {
      font-weight: 700;
      font-size: 11px;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .btn-demo-credential .role-tag {
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body class="terminal-grid-bg scanlines">

  <!-- Ambient Glow in Corners -->
  <div class="ambient-glow glow-cyan"></div>
  <div class="ambient-glow glow-purple"></div>

  <div class="login-container">
    <div class="login-panel">
      <!-- Brand & Header -->
      <div class="brand-header">
        <div class="brand-logo-emblem">
          <!-- Cyber Shield SVG -->
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            <path d="M9 12l2 2 4-4"/>
          </svg>
        </div>
        <div>
          <div class="brand-title">NEURO<span>SHIELD</span></div>
          <div class="system-status-chip">
            <span class="system-pulse"></span>
            <span>GATEWAY: ZERO-TRUST ONLINE</span>
          </div>
        </div>
      </div>

      <!-- Error Banner -->
      <div id="error-box" class="error-banner"></div>

      <!-- Authentication Form -->
      <form id="login-form">
        <div class="form-group">
          <label for="email">[ IDENTITY // USER EMAIL ]</label>
          <input type="email" id="email" class="form-control" placeholder="admin@neuroshield.local" required autocomplete="username">
        </div>

        <div class="form-group">
          <label for="password">[ ACCESS TOKEN // PASSWORD ]</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••••••" required autocomplete="current-password">
        </div>

        <button type="submit" id="btn-submit" class="btn btn-primary" style="width: 100%; margin-top: 6px; padding: 11px;">
          ⚡ AUTHENTICATE & ENTER SOC
        </button>

        <div style="display: flex; justify-content: flex-end; margin-top: 10px;">
          <a href="#" id="link-forgot-password" style="font-family: var(--font-mono); font-size: 10px; color: var(--cyber-cyan); text-decoration: none; letter-spacing: 0.5px;">
            🔑 [ FORGOT PASSWORD? RESET CREDENTIALS ]
          </a>
        </div>
      </form>

      <!-- Recover Identity Drawer -->
      <div id="forgot-password-panel" style="display: none; margin-top: 16px; padding: 16px; background: rgba(9, 14, 22, 0.95); border: 1px solid rgba(0, 229, 255, 0.35); border-radius: var(--border-radius-sm); box-shadow: 0 0 16px rgba(0, 229, 255, 0.15);">
        <div style="font-family: var(--font-mono); font-size: 11px; font-weight: 700; color: var(--cyber-cyan); margin-bottom: 10px; letter-spacing: 1px;">
          // RECOVER IDENTITY & SET NEW PASSWORD //
        </div>
        <form id="reset-password-form">
          <div class="form-group" style="margin-bottom: 10px;">
            <label for="reset-email" style="font-size: 10px;">[ REGISTERED CORPORATE EMAIL ]</label>
            <input type="email" id="reset-email" class="form-control" placeholder="e.g. employee@neuroshield.local" required style="padding: 7px 10px; font-size: 12px;">
          </div>
          <div class="form-group" style="margin-bottom: 12px;">
            <label for="reset-new-password" style="font-size: 10px;">[ NEW ACCESS PASSWORD ]</label>
            <input type="password" id="reset-new-password" class="form-control" placeholder="Minimum 6 characters" required style="padding: 7px 10px; font-size: 12px;">
          </div>
          <div id="reset-msg" style="display: none; font-family: var(--font-mono); font-size: 11px; padding: 8px 10px; border-radius: 3px; margin-bottom: 10px;"></div>
          <div style="display: flex; gap: 8px;">
            <button type="submit" id="btn-submit-reset" class="btn btn-primary" style="flex: 1; padding: 7px; font-size: 11px;">
              ⚡ RESET PASSWORD
            </button>
            <button type="button" id="btn-cancel-reset" class="btn btn-secondary" style="padding: 7px 12px; font-size: 11px;">
              CANCEL
            </button>
          </div>
        </form>
      </div>

      <!-- 1-Click Fast SOC Access -->
      <div class="demo-roster-box">
        <div class="demo-roster-header">
          <span>[ 1-CLICK SOC IDENTITIES ]</span>
          <span style="color: var(--text-muted); font-size: 10px;">Pass: Password123!</span>
        </div>
        <div class="demo-grid">
          <button type="button" class="btn-demo-credential btn-demo-login" data-email="admin@neuroshield.local">
            <span class="role-title">🛡️ SOC Admin</span>
            <span class="role-tag" style="color: var(--cyber-cyan);">ADMIN • Full Clearance</span>
          </button>
          <button type="button" class="btn-demo-credential btn-demo-login" data-email="ciso@neuroshield.local">
            <span class="role-title">👔 CISO Executive</span>
            <span class="role-tag" style="color: var(--neon-purple);">ADMIN • Security Chief</span>
          </button>
          <button type="button" class="btn-demo-credential btn-demo-login" data-email="analyst@neuroshield.local">
            <span class="role-title">🔍 Threat Analyst</span>
            <span class="role-tag" style="color: var(--warning-orange);">ANALYST • Hunt & Triage</span>
          </button>
          <button type="button" class="btn-demo-credential btn-demo-login" data-email="devops@neuroshield.local">
            <span class="role-title">💻 DevOps Lead</span>
            <span class="role-tag" style="color: var(--neon-green);">EMPLOYEE • Cloud Sec</span>
          </button>
          <button type="button" class="btn-demo-credential btn-demo-login" data-email="insider@neuroshield.local">
            <span class="role-title">⚠️ Suspicious Insider</span>
            <span class="role-tag" style="color: var(--danger-red);">SUSPENDED • Anomaly</span>
          </button>
          <button type="button" class="btn-demo-credential btn-demo-login" data-email="employee@neuroshield.local">
            <span class="role-title">👤 Standard User</span>
            <span class="role-tag" style="color: var(--neon-green);">EMPLOYEE • Baseline</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    async function performLogin(email, password) {
      const errorBox = document.getElementById('error-box');
      const btnSubmit = document.getElementById('btn-submit');
      errorBox.style.display = 'none';

      btnSubmit.disabled = true;
      btnSubmit.innerHTML = 'VERIFYING BIOMETRICS & CREDENTIALS... <span class="terminal-cursor"></span>';

      try {
        await window.authManager.login(email, password);
        btnSubmit.innerHTML = 'ACCESS GRANTED. INITIALIZING SOC...';
        btnSubmit.style.background = 'var(--neon-green)';
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 300);
      } catch (err) {
        errorBox.textContent = `[ AUTH_FAIL ]: ${err.message || 'Authentication failed. Please verify credentials.'}`;
        errorBox.style.display = 'block';
        btnSubmit.disabled = false;
        btnSubmit.textContent = '⚡ AUTHENTICATE & ENTER SOC';
      }
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      await performLogin(email, password);
    });

    document.querySelectorAll('.btn-demo-login').forEach(btn => {
      btn.addEventListener('click', async () => {
        const email = btn.getAttribute('data-email');
        const password = 'Password123!';
        document.getElementById('email').value = email;
        document.getElementById('password').value = password;
        await performLogin(email, password);
      });
    });

    // Forgot Password Panel Toggle & Handler
    const linkForgot = document.getElementById('link-forgot-password');
    const panelForgot = document.getElementById('forgot-password-panel');
    const btnCancelReset = document.getElementById('btn-cancel-reset');
    const formReset = document.getElementById('reset-password-form');
    const resetMsg = document.getElementById('reset-msg');

    linkForgot.addEventListener('click', (e) => {
      e.preventDefault();
      panelForgot.style.display = panelForgot.style.display === 'none' ? 'block' : 'none';
      if (panelForgot.style.display === 'block') {
        const currentEmail = document.getElementById('email').value.trim();
        if (currentEmail) document.getElementById('reset-email').value = currentEmail;
        document.getElementById('reset-new-password').focus();
      }
    });

    btnCancelReset.addEventListener('click', () => {
      panelForgot.style.display = 'none';
      formReset.reset();
      resetMsg.style.display = 'none';
    });

    formReset.addEventListener('submit', async (e) => {
      e.preventDefault();
      resetMsg.style.display = 'none';
      const btnSubmit = document.getElementById('btn-submit-reset');
      btnSubmit.disabled = true;
      btnSubmit.textContent = 'RESETTING...';

      const email = document.getElementById('reset-email').value.trim();
      const newPassword = document.getElementById('reset-new-password').value;

      try {
        const res = await window.apiClient.post('/api/auth/reset-password', { email, newPassword });
        resetMsg.style.display = 'block';
        resetMsg.style.background = 'rgba(0, 255, 136, 0.1)';
        resetMsg.style.border = '1px solid var(--neon-green)';
        resetMsg.style.color = 'var(--neon-green)';
        resetMsg.textContent = res.message || 'Password reset successfully! You can now log in.';

        // Populate login fields
        document.getElementById('email').value = email;
        document.getElementById('password').value = newPassword;

        setTimeout(() => {
          panelForgot.style.display = 'none';
          formReset.reset();
          resetMsg.style.display = 'none';
        }, 1800);
      } catch (err) {
        resetMsg.style.display = 'block';
        resetMsg.style.background = 'rgba(255, 59, 92, 0.15)';
        resetMsg.style.border = '1px solid var(--danger-red)';
        resetMsg.style.color = '#ff99b3';
        resetMsg.textContent = `[ ERROR ]: ${err.message || 'Failed to reset password.'}`;
      } finally {
        btnSubmit.disabled = false;
        btnSubmit.textContent = '⚡ RESET PASSWORD';
      }
    });
  </script>
</body>
</html>
