<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NeuroShield — Hardware & Core Boot Diagnostics</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: var(--bg-primary);
      position: relative;
      overflow: hidden;
      padding: 24px;
    }

    .startup-panel {
      width: 100%;
      max-width: 500px;
      padding: 32px;
      border-radius: var(--border-radius);
      background: rgba(11, 17, 25, 0.94);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(0, 229, 255, 0.25);
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.85), 0 0 24px rgba(0, 229, 255, 0.08);
      position: relative;
      z-index: 10;
    }

    .startup-panel::before {
      content: "";
      position: absolute;
      top: -1px;
      left: -1px;
      width: 16px;
      height: 16px;
      border-top: 2px solid var(--neon-green);
      border-left: 2px solid var(--neon-green);
      border-top-left-radius: 4px;
      pointer-events: none;
    }

    .startup-panel::after {
      content: "";
      position: absolute;
      bottom: -1px;
      right: -1px;
      width: 16px;
      height: 16px;
      border-bottom: 2px solid var(--cyber-cyan);
      border-right: 2px solid var(--cyber-cyan);
      border-bottom-right-radius: 4px;
      pointer-events: none;
    }

    .brand-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 12px;
    }

    .brand-logo-emblem {
      width: 42px;
      height: 42px;
      border-radius: var(--border-radius-sm);
      background: rgba(0, 229, 255, 0.08);
      border: 1px solid var(--cyber-cyan);
      box-shadow: 0 0 12px rgba(0, 229, 255, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--neon-green);
      flex-shrink: 0;
    }

    .brand-title {
      font-family: var(--font-mono);
      font-size: 20px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 2px;
    }

    .brand-title span {
      color: var(--neon-green);
      text-shadow: 0 0 10px rgba(0, 255, 136, 0.6);
    }

    .brand-tagline {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--cyber-cyan);
      letter-spacing: 1.5px;
      margin-bottom: 24px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-list {
      background: rgba(5, 7, 10, 0.75);
      border: 1px solid rgba(0, 229, 255, 0.12);
      border-radius: var(--border-radius-sm);
      padding: 8px 16px;
      margin-bottom: 20px;
    }

    .status-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid rgba(0, 229, 255, 0.08);
      font-family: var(--font-mono);
    }

    .status-item:last-child {
      border-bottom: none;
    }

    .status-item .label {
      font-size: 11px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-item .indicator {
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 0.5px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .status-ok { color: var(--neon-green); }
    .status-fail { color: var(--danger-red); }
    .status-degraded { color: var(--warning-orange); }

    .action-row {
      margin-top: 24px;
      display: flex;
      gap: 12px;
    }

    .action-row .btn {
      flex: 1;
      padding: 11px 16px;
    }

    .warning-box {
      margin-top: 16px;
      padding: 10px 14px;
      background: rgba(255, 59, 92, 0.12);
      border: 1px solid var(--danger-red);
      border-radius: var(--border-radius-sm);
      font-family: var(--font-mono);
      font-size: 11px;
      color: #ff99b3;
      display: none;
      line-height: 1.5;
    }
  </style>
</head>
<body class="terminal-grid-bg scanlines">

  <!-- Ambient Glow in Corners -->
  <div class="ambient-glow glow-cyan"></div>
  <div class="ambient-glow glow-purple"></div>

  <div class="startup-panel">
    <div class="brand-header">
      <div class="brand-logo-emblem">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <path d="M9 12l2 2 4-4"/>
        </svg>
      </div>
      <div>
        <div class="brand-title">NEURO<span>SHIELD</span></div>
        <div class="brand-tagline">
          <span class="system-pulse"></span>
          PREDICT. ADAPT. DEFEND. // SOC CORE
        </div>
      </div>
    </div>

    <!-- Diagnostic Checklist -->
    <div class="status-list">
      <div class="status-item">
        <span class="label"><span>[01]</span> Electron Native Shell</span>
        <span id="st-app" class="indicator status-ok">✓ READY</span>
      </div>
      <div class="status-item">
        <span class="label"><span>[02]</span> Express REST Engine</span>
        <span id="st-express" class="indicator">CHECKING...</span>
      </div>
      <div class="status-item">
        <span class="label"><span>[03]</span> Persistence / MongoDB</span>
        <span id="st-db" class="indicator">CHECKING...</span>
      </div>
      <div class="status-item">
        <span class="label"><span>[04]</span> Socket.IO Event Stream</span>
        <span id="st-realtime" class="indicator">CHECKING...</span>
      </div>
    </div>

    <div id="warning-banner" class="warning-box">
      MongoDB Atlas is currently offline. Standalone mock mode ready.
    </div>

    <div class="action-row">
      <button id="btn-enter" class="btn btn-primary" disabled>
        ENTER SOC TERMINAL <span class="terminal-cursor"></span>
      </button>
      <button id="btn-retry" class="btn btn-secondary">RE-CHECK</button>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    async function checkStartupHealth() {
      const stExpress = document.getElementById('st-express');
      const stDb = document.getElementById('st-db');
      const stRealtime = document.getElementById('st-realtime');
      const btnEnter = document.getElementById('btn-enter');
      const warningBanner = document.getElementById('warning-banner');

      try {
        const startupState = window.neuroshield && window.neuroshield.getStartupState
          ? await window.neuroshield.getStartupState()
          : null;

        if (startupState && startupState.error) {
          throw new Error(startupState.error);
        }

        const baseUrl = await window.apiClient.getBaseUrl();
        const res = await fetch(`${baseUrl}/api/health`);
        const health = await res.json();

        stExpress.className = 'indicator status-ok';
        stExpress.textContent = '✓ ONLINE';

        if (health.services && health.services.database === 'connected') {
          stDb.className = 'indicator status-ok';
          const isEmbedded = health.services.databaseMode === 'embedded';
          stDb.textContent = isEmbedded ? '✓ READY (LOCAL)' : '✓ CONNECTED (ATLAS)';
          if (isEmbedded) {
            warningBanner.style.display = 'block';
            warningBanner.style.background = 'rgba(0, 229, 255, 0.08)';
            warningBanner.style.borderColor = 'var(--cyber-cyan)';
            warningBanner.style.color = '#a0e7ff';
            warningBanner.textContent = 'Running in Local Standalone Mode. Demo accounts provisioned and ready.';
          } else {
            warningBanner.style.display = 'none';
          }
        } else {
          stDb.className = 'indicator status-fail';
          stDb.textContent = '✗ OFFLINE';
          warningBanner.style.display = 'block';
          warningBanner.style.background = 'rgba(255, 59, 92, 0.12)';
          warningBanner.style.borderColor = 'var(--danger-red)';
          warningBanner.style.color = '#ff99b3';
          warningBanner.textContent = 'MongoDB is offline. Open System Settings to configure MONGODB_URI.';
        }

        if (health.services && health.services.realtime === 'connected') {
          stRealtime.className = 'indicator status-ok';
          stRealtime.textContent = '✓ CONNECTED';
        } else {
          stRealtime.className = 'indicator status-degraded';
          stRealtime.textContent = '⚡ LOCAL BUS';
        }

        btnEnter.disabled = false;
      } catch (err) {
        stExpress.className = 'indicator status-fail';
        stExpress.textContent = '✗ OFFLINE';
        stDb.className = 'indicator status-fail';
        stDb.textContent = '✗ OFFLINE';
        stRealtime.className = 'indicator status-fail';
        stRealtime.textContent = '✗ OFFLINE';
        warningBanner.style.display = 'block';
        warningBanner.textContent = `Backend Express API unavailable: ${err.message}`;
        btnEnter.disabled = true;
      }
    }

    document.getElementById('btn-enter').addEventListener('click', () => {
      window.location.href = 'login.html';
    });

    document.getElementById('btn-retry').addEventListener('click', checkStartupHealth);

    checkStartupHealth();
  </script>
</body>
</html>
