<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body style="padding: 24px; background: var(--bg-primary);">
  <h1 style="font-size: 22px; font-weight: 800; color: var(--text-primary); margin-bottom: 6px;">Unified Security Event Stream</h1>
  <p style="font-size: 13px; color: var(--text-secondary); margin-bottom: 24px;">Continuous security telemetry event bus across all 5 AI defense layers.</p>

  <div class="glass-panel" style="padding: 24px;">
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Timestamp</th>
            <th>Event Type</th>
            <th>Severity</th>
            <th>Source Layer</th>
            <th>Description & Metadata</th>
          </tr>
        </thead>
        <tbody id="tbl-events">
          <tr><td colspan="5" style="text-align: center; color: var(--text-muted);">Loading security event stream...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

<script src="../js/api.js"></script>
<script>
  async function loadEvents() {
    try {
      const res = await window.apiClient.get('/api/events');
      const events = res.events || [];
      const tbody = document.getElementById('tbl-events');
      if (events.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--text-muted);">No security events recorded.</td></tr>`;
      } else {
        tbody.innerHTML = events.map(e => `
          <tr>
            <td><small>${new Date(e.timestamp).toLocaleString()}</small></td>
            <td><strong>${e.eventType}</strong></td>
            <td><span class="tag-severity tag-${e.severity}">${e.severity}</span></td>
            <td><small>${e.sourceLayer}</small></td>
            <td>${e.description}</td>
          </tr>
        `).join('');
      }
    } catch (e) {
      console.warn('Events load note:', e.message);
    }
  }

  loadEvents();
</script>
</body>
</html>
