<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body style="padding: 24px; background: var(--bg-primary);">
  <h1 style="font-size: 22px; font-weight: 800; color: var(--text-primary); margin-bottom: 6px;">Append-Only Audit Trail Logs</h1>
  <p style="font-size: 13px; color: var(--text-secondary); margin-bottom: 24px;">Immutable system operation trail. Modification and deletion of audit logs is strictly prohibited by application policy.</p>

  <div class="glass-panel" style="padding: 24px;">
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Timestamp</th>
            <th>User</th>
            <th>Action</th>
            <th>Resource</th>
            <th>IP Address</th>
          </tr>
        </thead>
        <tbody id="tbl-audit">
          <tr><td colspan="5" style="text-align: center; color: var(--text-muted);">Loading audit logs...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

<script src="../js/api.js"></script>
<script>
  async function loadAuditLogs() {
    try {
      const res = await window.apiClient.get('/api/audit');
      const logs = res.logs || [];
      const tbody = document.getElementById('tbl-audit');
      if (logs.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--text-muted);">No audit logs recorded yet.</td></tr>`;
      } else {
        tbody.innerHTML = logs.map(l => `
          <tr>
            <td><small>${new Date(l.timestamp).toLocaleString()}</small></td>
            <td><strong>${l.userName || 'System'}</strong></td>
            <td><span class="tag-severity tag-LOW">${l.action}</span></td>
            <td><code>${l.resource}</code></td>
            <td><small>${l.ipAddress || '127.0.0.1'}</small></td>
          </tr>
        `).join('');
      }
    } catch (e) {
      document.getElementById('tbl-audit').innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--accent-red);">${e.message}</td></tr>`;
    }
  }

  loadAuditLogs();
</script>
</body>
</html>
